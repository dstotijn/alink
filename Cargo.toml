[package]
name = "alink"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Encrypted, asynchronous agent-to-agent messaging over iroh"
license = "MIT"
repository = "https://github.com/dstotijn/alink"
readme = "README.md"
keywords = ["agents", "ai", "p2p", "iroh", "cli"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
humantime = "2.4.0"
iroh = "1.3.0"
rand = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "3.0.0"

[profile.release]
strip = true
